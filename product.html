<script>

    /* =====================================================
       GET PRODUCT ID FROM URL
       ===================================================== */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const productId =
        urlParams.get("id");



    /* =====================================================
       PRODUCT
       ===================================================== */

    let product = null;



    /* =====================================================
       LOAD PRODUCT FROM API
       ===================================================== */

    async function loadProduct() {

        if (!productId) {

            showProductError(
                "Product not found."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/products/${encodeURIComponent(productId)}`
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success ||
                !data.product
            ) {

                showProductError(
                    "Product not found."
                );

                return;

            }


            product =
                data.product;



            /* =============================================
               UPDATE PAGE
               ============================================= */

            document.title =
                `${product.name} | Threadly Co.`;


            document.getElementById(
                "product-name"
            ).textContent =
                product.name;


            document.getElementById(
                "product-category"
            ).textContent =
                product.category.toUpperCase();


            document.getElementById(
                "product-price"
            ).textContent =
                `$${Number(product.price).toFixed(2)}`;


            document.getElementById(
                "product-image"
            ).src =
                product.image;


            document.getElementById(
                "product-image"
            ).alt =
                product.name;


            document.getElementById(
                "product-description-text"
            ).textContent =
                product.description;


            document.getElementById(
                "breadcrumb-product"
            ).textContent =
                product.name;



            /* =============================================
               UPDATE META DESCRIPTION
               ============================================= */

            const metaDescription =
                document.querySelector(
                    'meta[name="description"]'
                );


            if (metaDescription) {

                metaDescription.setAttribute(
                    "content",
                    product.description
                );

            }


        } catch (error) {

            console.error(
                "Failed to load product:",
                error
            );


            showProductError(
                "Unable to load this product."
            );

        }

    }



    /* =====================================================
       PRODUCT ERROR
       ===================================================== */

    function showProductError(message) {

        document.getElementById(
            "product-name"
        ).textContent =
            message;


        document.getElementById(
            "product-description-text"
        ).textContent =
            "Please return to the shop and try again.";


        document.getElementById(
            "add-to-cart"
        ).disabled =
            true;

    }



    /* =====================================================
       COLOR SELECTION
       ===================================================== */

    let selectedColor =
        "Black";


    const colorButtons =
        document.querySelectorAll(
            ".color-option"
        );


    const selectedColorText =
        document.getElementById(
            "selected-color"
        );


    colorButtons.forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {


                    colorButtons.forEach(
                        function(btn) {

                            btn.classList.remove(
                                "active"
                            );

                        }
                    );


                    button.classList.add(
                        "active"
                    );


                    selectedColor =
                        button.dataset.color;


                    selectedColorText.textContent =
                        selectedColor;

                }
            );

        }
    );



    /* =====================================================
       SIZE SELECTION
       ===================================================== */

    let selectedSize =
        "M";


    const sizeButtons =
        document.querySelectorAll(
            ".size-option"
        );


    sizeButtons.forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {


                    sizeButtons.forEach(
                        function(btn) {

                            btn.classList.remove(
                                "active"
                            );

                        }
                    );


                    button.classList.add(
                        "active"
                    );


                    selectedSize =
                        button.dataset.size;

                }
            );

        }
    );



    /* =====================================================
       QUANTITY
       ===================================================== */

    let quantity =
        1;


    const quantityDisplay =
        document.getElementById(
            "quantity"
        );


    document
        .getElementById(
            "quantity-minus"
        )
        .addEventListener(
            "click",
            function() {

                if (quantity > 1) {

                    quantity--;


                    quantityDisplay.textContent =
                        quantity;

                }

            }
        );


    document
        .getElementById(
            "quantity-plus"
        )
        .addEventListener(
            "click",
            function() {

                if (quantity < 10) {

                    quantity++;


                    quantityDisplay.textContent =
                        quantity;

                }

            }
        );



    /* =====================================================
       CART STORAGE
       ===================================================== */

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];

        } catch (error) {

            console.error(
                "Failed to read cart:",
                error
            );


            return [];

        }

    }



    function saveCart(cart) {

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

    }



    /* =====================================================
       CART COUNT
       ===================================================== */

    function updateCartCount() {

        const cart =
            getCart();


        const count =
            cart.reduce(
                function(total, item) {

                    return total +
                        Number(item.quantity || 0);

                },
                0
            );


        const cartCount =
            document.getElementById(
                "cart-count"
            );


        if (cartCount) {

            cartCount.textContent =
                count;

        }

    }



    /* =====================================================
       ADD TO CART
       ===================================================== */

    document
        .getElementById(
            "add-to-cart"
        )
        .addEventListener(
            "click",
            function() {


                if (!product) {

                    return;

                }


                const cart =
                    getCart();



                /*
                 * Same product
                 * + same color
                 * + same size
                 *
                 * = same cart item
                 */

                const existingItem =
                    cart.find(
                        function(item) {

                            return (
                                String(
                                    item.productId
                                ) ===
                                String(
                                    product.id
                                ) &&

                                item.color ===
                                selectedColor &&

                                item.size ===
                                selectedSize
                            );

                        }
                    );


                if (existingItem) {

                    existingItem.quantity =
                        Math.min(
                            existingItem.quantity +
                            quantity,
                            10
                        );

                } else {

                    cart.push({

                        productId:
                            product.id,

                        color:
                            selectedColor,

                        size:
                            selectedSize,

                        quantity:
                            quantity

                    });

                }


                saveCart(
                    cart
                );


                updateCartCount();



                const message =
                    document.getElementById(
                        "cart-message"
                    );


                message.textContent =
                    "Added to cart ✓";


                message.classList.add(
                    "show"
                );


                setTimeout(
                    function() {

                        message.classList.remove(
                            "show"
                        );

                    },
                    2500
                );

            }
        );



    /* =====================================================
       INITIALIZE
       ===================================================== */

    updateCartCount();

    loadProduct();

</script>
