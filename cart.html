<script>

    /* =====================================================
       CART STORAGE
       ===================================================== */

    function getCart() {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    }


    function saveCart(cart) {

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

    }



    /* =====================================================
       FORMAT MONEY
       ===================================================== */

    function formatMoney(amount) {

        return "$" +
            Number(amount).toFixed(2);

    }



    /* =====================================================
       UPDATE CART COUNT
       ===================================================== */

    function updateCartCount() {

        const cart =
            getCart();


        const count =
            cart.reduce(
                function(total, item) {

                    return total +
                        Number(item.quantity || 0);

                },
                0
            );


        const cartCount =
            document.getElementById(
                "cart-count"
            );


        if (cartCount) {

            cartCount.textContent =
                count;

        }

    }



    /* =====================================================
       GET PRODUCT FROM API
       ===================================================== */

    async function getProduct(productId) {

        try {

            const response =
                await fetch(
                    `/api/products/${encodeURIComponent(productId)}`
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success ||
                !data.product
            ) {

                return null;

            }


            return data.product;

        } catch (error) {

            console.error(
                "Failed to load product:",
                error
            );


            return null;

        }

    }



    /* =====================================================
       RENDER CART
       ===================================================== */

    async function renderCart() {

        const cart =
            getCart();


        const cartContent =
            document.getElementById(
                "cart-content"
            );


        const emptyCart =
            document.getElementById(
                "empty-cart"
            );


        const cartItemsList =
            document.getElementById(
                "cart-items-list"
            );


        /* =================================================
           EMPTY CART
           ================================================= */

        if (cart.length === 0) {

            cartContent.style.display =
                "none";


            emptyCart.style.display =
                "block";


            updateCartCount();


            return;

        }



        /* =================================================
           SHOW CART
           ================================================= */

        cartContent.style.display =
            "";


        emptyCart.style.display =
            "none";


        cartItemsList.innerHTML =
            "<p>Loading your cart...</p>";



        /* =================================================
           LOAD ALL PRODUCTS
           ================================================= */

        const productResults =
            await Promise.all(

                cart.map(
                    function(item) {

                        return getProduct(
                            item.productId
                        );

                    }
                )

            );



        /* =================================================
           BUILD VALID CART
           ================================================= */

        const validCart =
            [];


        const cartItems =
            [];


        let subtotal =
            0;



        for (
            let index = 0;
            index < cart.length;
            index++
        ) {

            const item =
                cart[index];


            const product =
                productResults[index];



            /* =============================================
               PRODUCT DOES NOT EXIST
               ============================================= */

            if (!product) {

                console.warn(
                    "Product not found:",
                    item.productId
                );


                continue;

            }



            /* =============================================
               CLEAN / NORMALIZE CART ITEM
               ============================================= */

            const cleanItem = {

                productId:
                    String(product.id),

                color:
                    item.color || "Black",

                size:
                    item.size || "M",

                quantity:
                    Math.max(
                        1,
                        Math.min(
                            Number(item.quantity) || 1,
                            10
                        )
                    )

            };



            validCart.push(
                cleanItem
            );



            /*
             * This index belongs to validCart,
             * NOT the old cart array.
             */

            const validIndex =
                validCart.length - 1;



            /* =============================================
               PRICE
               ============================================= */

            const itemPrice =
                Number(product.price);


            const itemTotal =
                itemPrice *
                cleanItem.quantity;


            subtotal +=
                itemTotal;



            /*
             * Store everything needed
             * to render the product.
             */

            cartItems.push({

                product:
                    product,

                item:
                    cleanItem,

                index:
                    validIndex,

                price:
                    itemPrice,

                total:
                    itemTotal

            });

        }



        /* =================================================
           SAVE CLEAN CART
           ================================================= */

        saveCart(
            validCart
        );



        /* =================================================
           CART BECAME EMPTY
           ================================================= */

        if (validCart.length === 0) {

            cartContent.style.display =
                "none";


            emptyCart.style.display =
                "block";


            updateCartCount();


            return;

        }



        /* =================================================
           RENDER ITEMS
           ================================================= */

        cartItemsList.innerHTML =
            "";



        cartItems.forEach(
            function(cartItem) {

                const product =
                    cartItem.product;


                const item =
                    cartItem.item;


                const validIndex =
                    cartItem.index;


                const itemPrice =
                    cartItem.price;


                const itemTotal =
                    cartItem.total;



                const itemElement =
                    document.createElement(
                        "article"
                    );


                itemElement.className =
                    "cart-item";


                itemElement.innerHTML = `

                    <div class="cart-product">

                        <a
                            href="product.html?id=${product.id}"
                            class="cart-product-image"
                        >

                            <img
                                src="${escapeHtml(product.image || "")}"
                                alt="${escapeHtml(product.name)}"
                            >

                        </a>


                        <div class="cart-product-info">

                            <a
                                href="product.html?id=${product.id}"
                                class="cart-product-name"
                            >

                                ${escapeHtml(
                                    product.name
                                )}

                            </a>


                            <p>

                                Color:

                                <strong>

                                    ${escapeHtml(
                                        item.color
                                    )}

                                </strong>

                            </p>


                            <p>

                                Size:

                                <strong>

                                    ${escapeHtml(
                                        item.size
                                    )}

                                </strong>

                            </p>


                            <p
                                class="cart-unit-price"
                            >

                                ${formatMoney(
                                    itemPrice
                                )}

                            </p>


                            <button
                                type="button"
                                class="remove-item"
                                data-index="${validIndex}"
                            >

                                Remove

                            </button>

                        </div>

                    </div>



                    <div
                        class="cart-quantity"
                    >

                        <button
                            type="button"
                            class="quantity-btn"
                            data-action="decrease"
                            data-index="${validIndex}"
                        >

                            −

                        </button>


                        <span>

                            ${item.quantity}

                        </span>


                        <button
                            type="button"
                            class="quantity-btn"
                            data-action="increase"
                            data-index="${validIndex}"
                        >

                            +

                        </button>

                    </div>



                    <div
                        class="cart-item-total"
                    >

                        ${formatMoney(
                            itemTotal
                        )}

                    </div>

                `;


                cartItemsList.appendChild(
                    itemElement
                );

            }
        );



        /* =================================================
           SHIPPING
           ================================================= */

        const shipping =
            subtotal >= 50
                ? 0
                : 5.99;



        const total =
            subtotal +
            shipping;



        /* =================================================
           UPDATE SUMMARY
           ================================================= */

        document.getElementById(
            "cart-subtotal"
        ).textContent =
            formatMoney(
                subtotal
            );


        document.getElementById(
            "cart-shipping"
        ).textContent =
            shipping === 0
                ? "FREE"
                : formatMoney(
                    shipping
                );


        document.getElementById(
            "cart-total"
        ).textContent =
            formatMoney(
                total
            );



        updateCartCount();

    }



    /* =====================================================
       UPDATE QUANTITY
       ===================================================== */

    document.addEventListener(
        "click",
        function(event) {


            const button =
                event.target.closest(
                    ".quantity-btn"
                );


            if (!button) {

                return;

            }



            const index =
                Number(
                    button.dataset.index
                );


            const action =
                button.dataset.action;



            const cart =
                getCart();



            if (!cart[index]) {

                return;

            }



            /* =============================================
               INCREASE
               ============================================= */

            if (
                action ===
                "increase"
            ) {

                if (
                    cart[index].quantity < 10
                ) {

                    cart[index].quantity++;

                }

            }



            /* =============================================
               DECREASE
               ============================================= */

            if (
                action ===
                "decrease"
            ) {

                cart[index].quantity--;


                if (
                    cart[index].quantity <= 0
                ) {

                    cart.splice(
                        index,
                        1
                    );

                }

            }



            saveCart(
                cart
            );


            renderCart();

        }
    );



    /* =====================================================
       REMOVE ITEM
       ===================================================== */

    document.addEventListener(
        "click",
        function(event) {


            const button =
                event.target.closest(
                    ".remove-item"
                );


            if (!button) {

                return;

            }



            const index =
                Number(
                    button.dataset.index
                );


            const cart =
                getCart();



            if (
                index < 0 ||
                index >= cart.length
            ) {

                return;

            }



            cart.splice(
                index,
                1
            );


            saveCart(
                cart
            );


            renderCart();

        }
    );



    /* =====================================================
       CHECKOUT
       ===================================================== */

    const checkoutButton =
        document.getElementById(
            "checkout-btn"
        );


    if (checkoutButton) {

        checkoutButton.addEventListener(
            "click",
            function() {


                const cart =
                    getCart();


                if (cart.length === 0) {

                    return;

                }


                window.location.href =
                    "checkout.html";

            }
        );

    }



    /* =====================================================
       HTML ESCAPE
       ===================================================== */

    function escapeHtml(value) {

        return String(
            value || ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }



    /* =====================================================
       INITIALIZE
       ===================================================== */

    renderCart();

</script>
